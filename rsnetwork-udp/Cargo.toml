[package]
name = "rsnetwork-udp"
version = "0.1.0-alpha.2"
description = "Datagram I/O on any socket that the caller owns, with segmentation offload, ECN, packet information, and truncation, and the system declarations that the networking family and its runtimes share."
repository = "https://github.com/loadingalias/rsasync"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# The datagram calls on a socket. Without `std`, the crate has only its
# declarations and its control-message encoding, which need only `core`.
std = []
# On macOS, `send_batch` and `recv_batch` use one system call for the batch: the private calls
# `sendmsg_x` and `recvmsg_x`. It has no effect on another target, so iOS never builds them.
macos-private-batch = ["std"]

# The tests of datagram I/O through a socket that Tokio owns.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["net", "rt"] }

[lints]
workspace = true

# The measurement of the batches of macOS. It uses the datagram calls, and it is its own program.
[[bench]]
name = "macos_batch"
harness = false
required-features = ["std"]

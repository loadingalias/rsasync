[toolchain]
channel = "nightly-2026-11-02"
profile = "minimal"
components = ["clippy", "rustfmt", "rust-analyzer", "rust-src"]
# wasm32v1-none is a target with no `std`. `cargo xtask fix` and `check` lint
# each crate that builds without `std` on it, so each use of `std` outside its
# feature fails. The two musl targets run the tests on musl, the second Linux
# C library: CI on x86_64, and the E1 hosts on both architectures.
targets = ["wasm32v1-none", "x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

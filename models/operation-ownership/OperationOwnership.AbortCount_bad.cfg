\* Known-bad: after an IOCP abort, the driver takes the abort as an ordinary
\* cancel and owes the count of the send. It must violate ExactCount.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 3
  MaxOps = 2
  Submissions = "resource"
  Conns = 1
  Backend = "iocp"
  Bug = "abortCount"
SPECIFICATION Spec
INVARIANT
  ExactCount

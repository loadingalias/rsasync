\* Known-bad: IOCP classifies the return by the Win32 value, so a warning
\* status is taken as terminal while its packet follows. It must violate
\* ReleaseOnce.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 3
  MaxOps = 2
  Submissions = "resource"
  Conns = 1
  Backend = "iocp"
  Bug = "win32"
SPECIFICATION Spec
INVARIANT
  ReleaseOnce

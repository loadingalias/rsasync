\* Known-bad: Grace expiry does not reset detached debt. The timers close
\* at grace expiry, so nothing ends the debt. It must violate
\* ShutdownJoins.
\* Smallest bounds that reach the failure: the trace needs one submission
\* and no byte. A trace at these bounds is also a behavior at the declared
\* bounds, because the consumer and the peer have no fairness.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 1
  MaxOps = 1
  Submissions = "resource"
  Conns = 1
  Backend = "uring"
  Bug = "noGraceReset"
SPECIFICATION Spec
PROPERTY
  ShutdownJoins

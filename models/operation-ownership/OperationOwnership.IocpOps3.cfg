\* The IOCP profile with three submissions on each resource; every
\* other bound is declared. The model argues this bound and does not prove
\* it, so one complete search raises it by one on the evidence host (family
\* policy, Design Models).
CONSTANTS
  Workers = {w1, w2}
  Bytes = 3
  MaxOps = 3
  Submissions = "resource"
  Conns = 1
  Backend = "iocp"
  Bug = "none"
SPECIFICATION Spec
INVARIANTS
  TypeOK
  ReleaseOnce
  NoImpossibleWait
  InOrderOnce
  NoStaleEffect
  ReportOnce
  ExactCount
  NoFalseEnd
PROPERTIES
  CloseReturns
  ShutdownJoins
  DetachedReleased
  LatestWakerWoken
  StablePhases

\* Known-bad: The design before 2026-11-07: close waits for a zero-copy
\* notice, which waits for the peer, and nothing resets the connection. It
\* must violate CloseReturns.
\* Smallest bounds that reach the failure: the trace needs one submission
\* and no byte. A trace at these bounds is also a behavior at the declared
\* bounds, because the consumer and the peer have no fairness.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 1
  MaxOps = 1
  Submissions = "resource"
  Conns = 1
  Backend = "uring"
  Bug = "zcWait"
SPECIFICATION Spec
PROPERTY
  CloseReturns

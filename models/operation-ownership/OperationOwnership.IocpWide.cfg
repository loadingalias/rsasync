\* The IOCP profile with two submissions on each direction (four on the
\* stream). It confirms on the evidence host that the wider reading of the
\* task bound adds no violation. Every property.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 3
  MaxOps = 2
  Submissions = "direction"
  Conns = 1
  Backend = "iocp"
  Bug = "none"
SPECIFICATION Spec
INVARIANTS
  TypeOK
  ReleaseOnce
  NoImpossibleWait
  InOrderOnce
  NoStaleEffect
  ReportOnce
  ExactCount
  NoFalseEnd
PROPERTIES
  CloseReturns
  ShutdownJoins
  DetachedReleased
  LatestWakerWoken
  StablePhases

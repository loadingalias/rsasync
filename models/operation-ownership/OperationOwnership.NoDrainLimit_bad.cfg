\* Known-bad: Option C as first proposed: no drain limit, so detached debt
\* stays while the runtime runs and the peer does not acknowledge. It must
\* violate DetachedReleased.
\* Smallest bounds that reach the failure: the trace needs one submission
\* and no byte. A trace at these bounds is also a behavior at the declared
\* bounds, because the consumer and the peer have no fairness.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 1
  MaxOps = 1
  Submissions = "resource"
  Conns = 1
  Backend = "uring"
  Bug = "noDrainLimit"
SPECIFICATION Spec
PROPERTY
  DetachedReleased

\* Known-bad: the mirror error of the old rule. The driver releases the
\* backing of a zero-copy send at its send result, not at its notice, so
\* the kernel can still read freed pages. It must violate ReleaseOnce.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 3
  MaxOps = 2
  Submissions = "resource"
  Conns = 1
  Backend = "uring"
  Bug = "zcEarlyRelease"
SPECIFICATION Spec
INVARIANT
  ReleaseOnce

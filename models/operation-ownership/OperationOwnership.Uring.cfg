\* The io_uring profile at the declared bounds: two workers, one stream and
\* one listener, two submissions on each resource, three bytes on the
\* receive direction, one connection. Every property.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 3
  MaxOps = 2
  Submissions = "resource"
  Conns = 1
  Backend = "uring"
  Bug = "none"
SPECIFICATION Spec
INVARIANTS
  TypeOK
  ReleaseOnce
  NoImpossibleWait
  InOrderOnce
  NoStaleEffect
  ReportOnce
PROPERTIES
  CloseReturns
  ShutdownJoins
  DetachedReleased
  LatestWakerWoken
  StablePhases

\* Known-bad: The home wakes the waker of the first poll. It must violate
\* LatestWakerWoken.
\* Smallest bounds that reach the failure: the trace needs one submission
\* and no byte. A trace at these bounds is also a behavior at the declared
\* bounds, because the consumer and the peer have no fairness.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 1
  MaxOps = 1
  Submissions = "resource"
  Conns = 1
  Backend = "uring"
  Bug = "staleWaker"
SPECIFICATION Spec
PROPERTY
  LatestWakerWoken

\* Reachability: a current request for a send finds no target in flight
\* ("not found"), because the send result came first, and its notice
\* follows. A pass is a trace that reaches the target.
CONSTANTS
  Workers = {w1, w2}
  Bytes = 3
  MaxOps = 2
  Submissions = "resource"
  Conns = 1
  Backend = "uring"
  Bug = "none"
SPECIFICATION Spec
PROPERTY
  UnreachedCancelNotFound

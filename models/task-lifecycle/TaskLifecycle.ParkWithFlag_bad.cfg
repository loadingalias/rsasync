\* Known-bad: The signal home parks with the signal flag set. It must
\* violate OwedWakeDelivered under the weak fairness of SigHandle.
\* Smallest bounds that reach the failure: one slot and one generation. The
\* consumer and the environment have no fairness, so a fair behavior at these
\* bounds is also a fair behavior at the declared bounds, where the other slot
\* stays free and no slot is reused.
CONSTANTS
  Workers = {w1, w2}
  B = b
  NSlots = 1
  MaxGen = 1
  Bug = "parkWithFlag"
SPECIFICATION Spec
PROPERTY
  OwedWakeDelivered

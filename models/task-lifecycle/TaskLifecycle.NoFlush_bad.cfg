\* Known-bad: A worker never sends the signal in its outbox while it runs.
\* It must violate OwedWakeDelivered. Smallest bounds that reach the
\* failure: one slot and one generation. The consumer and the environment
\* have no fairness, so a fair behavior at these bounds is also a fair
\* behavior at the declared bounds, where the other slot stays free and no
\* slot is reused.
CONSTANTS
  Workers = {w1, w2}
  B = b
  NSlots = 1
  MaxGen = 1
  Bug = "noFlush"
SPECIFICATION Spec
PROPERTY
  OwedWakeDelivered

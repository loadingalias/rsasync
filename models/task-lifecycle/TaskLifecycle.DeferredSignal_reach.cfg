\* Reachability: The signal home is parked, its list holds a task, and the
\* signal of that batch waits in the outbox of another worker. A pass is a
\* trace that reaches the target.
CONSTANTS
  Workers = {w1, w2}
  B = b
  NSlots = 2
  MaxGen = 2
  Bug = "none"
SPECIFICATION Spec
INVARIANT
  UnreachedDeferredSignal
